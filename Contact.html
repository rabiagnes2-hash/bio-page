
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Me</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVIGATION BAR -->
    <nav class="navbar">
        <span class="logo">RABI.A</span>

        <div class="logo">
            <a href="index.html" class="nav-link">Home</a>
            <a href="About.html" class="nav-link">About</a>
            <a href="Project.html" class="nav-link">Projects</a>
            <a href="Contact.html" class="nav-link active">Contact</a>
        </div>
    </nav>


    <!-- CONTACT INFORMATION -->
    <h2>Contact</h2>

    <p>Contact Information</p>
    <p>+27 638 868 8323</p>

    <h2>Email Address</h2>
    <p>Email: Fifiieyrabi82@gmail.com</p>

    <h2>Location</h2>
    <p>224c President Mbeki Dr</p>


    <!-- CONTACT FORM -->
    <section id="contact">

        <h2>Contact Me</h2>

        <form id="contactForm">

            <label for="name">Name</label>
            <input type="text" id="name" name="name"
                   required minlength="2">


            <label for="email">Email</label>
            <input type="email" id="email" name="email"
                   required placeholder="you@example.com">


            <label for="topic">Topic</label>
            <select id="topic" name="topic">
                <option value="general">General question</option>
                <option value="project">Project idea</option>
                <option value="feedback">Feedback</option>
            </select>


            <!-- PHONE NUMBER -->
            <label for="phone">Phone Number</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                pattern="[0-9-]+"
                placeholder="Example: 071-234-5678"
            >


            <!-- MESSAGE AND CHARACTER COUNTER -->
            <label for="message">Message</label>

            <textarea
                id="message"
                name="message"
                rows="4"
                required
            ></textarea>

            <p id="charCount">Characters: 0</p>


            <!-- PREFERRED REPLY -->
            <fieldset>
                <legend>Preferred Reply</legend>

                <label>
                    <input type="radio" name="reply" value="email">
                    Email
                </label>

                <label>
                    <input type="radio" name="reply" value="phone">
                    Phone
                </label>
            </fieldset>


            <!-- CHECKBOX -->
            <label>
                <input type="checkbox" name="copy" value="yes">
                Send me a copy of this message
            </label>


            <button type="submit">Send</button>

        </form>

        <p id="formMessage" role="status"></p>

    </section>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>
</html>
